<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Geist:wght@400;500;600&family=Geist+Mono&family=Noto+Serif+Devanagari:wght@700&display=block" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 30% 30%, #2a2160 0%, #120f2a 55%, #0b0a1a 100%);
    color: #f4efe3; font-family: "Geist", sans-serif;
  }
  .wrap { text-align: center; }
  .wrap > * { opacity: 0; transform: translateY(14px); transition: opacity .8s ease, transform .8s ease; }
  body.in .wrap > * { opacity: 1; transform: none; }
  body.in .wrap > :nth-child(2) { transition-delay: .15s; }
  body.in .wrap > :nth-child(3) { transition-delay: .35s; }
  body.in .wrap > :nth-child(4) { transition-delay: .55s; }
  body.in .wrap > :nth-child(5) { transition-delay: .75s; }
  .brand { display: inline-flex; align-items: center; gap: 24px; }
  .brand img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 0; font: 700 104px/1 "Cormorant Garamond", serif; letter-spacing: 1px; }
  /* Generous line height: background-clip text cuts off anything outside the box, like the top of ो */
  .deva { font: 700 40px/1.6 "Noto Serif Devanagari", serif; margin-top: 6px; padding: 4px 0;
    background: linear-gradient(100deg, #f5d27e, #f2853a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin: 22px 0 0; font-size: 30px; font-weight: 500; color: #c9c2d9; }
  .rule { width: 90px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #e9b949, #f2853a); margin: 30px auto; }
  .links { font-size: 24px; line-height: 1.8; color: #8d86a8; }
  .links b { color: #fff; font-weight: 500; font-family: "Geist Mono", monospace; }
  .coffee { color: #f5d27e; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="{{ICON}}" alt="" /><h1>Jyotish</h1></div>
    <div class="deva">ज्योतिष</div>
    <p class="tag">Free, open-source Vedic astrology · MIT</p>
    <div class="rule"></div>
    <div class="links">
      <div><b>github.com/amanjhacodes55/jyotish</b></div>
      <div>{{LIVE}}</div>
      <div class="coffee">☕ Buy me a coffee · UPI 8941951465@axl</div>
    </div>
  </div>
</body>
</html>
